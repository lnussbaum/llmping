[project]
name = "llmping"
version = "0.1.0"
description = "Ping-like health probes for OpenAI-compatible LLM servers"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Lucas Nussbaum", email = "lucas.nussbaum@inria.fr" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "uvicorn>=0.30",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
llmping = "llmping.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmping"]

[tool.coverage.run]
branch = true
source = ["llmping"]

[tool.coverage.report]
skip_covered = true

[tool.pytest.ini_options]
# Async tests are detected automatically — no @pytest.mark.asyncio needed.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/llmping/cli.py" = ["B008"]  # typer Argument/Option in defaults is idiomatic

[tool.mypy]
python_version = "3.13"
# tests are exercised, but typed source is the concern; keep tests checked
# with relaxed settings so test-only conveniences don't force noise.
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
no_implicit_reexport = true
strict_optional = true
